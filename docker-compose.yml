services:

  # ── BANCO DE DADOS ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-edulanches}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-troque_esta_senha}
      POSTGRES_DB:       ${DB_NAME:-edulanches}
    volumes:
      - dados_pg:/var/lib/postgresql/data   # persistência entre restarts
    # SEM "ports" — banco isolado na rede interna Docker, não exposto ao host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-edulanches} -d ${DB_NAME:-edulanches}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── APLICAÇÃO ───────────────────────────────────────────────────────────────
  app:
    build: .
    image: edulanches-app:1.0.0
    restart: unless-stopped
    environment:
      PORT:         3000
      APP_VERSION:  1.0.0
      DATABASE_URL: postgres://${DB_USER:-edulanches}:${DB_PASSWORD:-troque_esta_senha}@db:5432/${DB_NAME:-edulanches}
    ports:
      - "3000:3000"       # única porta exposta ao host
    depends_on:
      db:
        condition: service_healthy   # app só sobe quando banco está pronto e saudável

# ── VOLUMES ─────────────────────────────────────────────────────────────────
volumes:
  dados_pg:
    # Volume nomeado gerenciado pelo Docker — sobrevive a "docker compose down"
